<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dragondance Viewer</title>
<meta name="description" content="Dragondance 赛车 3D 查看器，支持正交视角、部件分组拆解和模型表面绘画。" />
<style>
  :root{
    --bg-0:#080b12;
    --bg-1:#0e1420;
    --panel:rgba(16,22,34,.72);
    --panel-brd:rgba(120,160,230,.16);
    --txt:#e7eefc;
    --txt-dim:#8fa0bf;
    --accent:#4ea8ff;
    --accent-2:#7de2c3;
    --shadow:0 12px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1200px 800px at 70% -10%, #16233a 0%, transparent 60%),
      radial-gradient(900px 700px at 10% 110%, #10202a 0%, transparent 55%),
      linear-gradient(180deg,#0a0e16 0%,#070a10 100%);
    color:var(--txt);
    font-family:"Segoe UI","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0}
  body[data-tools] #stage{left:290px}
  #stage canvas{display:block;touch-action:none;outline:none;cursor:grab}
  #stage canvas:active{cursor:grabbing}
  #stage canvas.is-painting{cursor:crosshair}
  #brush-cursor{position:fixed;z-index:2;pointer-events:none;transform:translate(-50%,-50%);
    border:1px solid var(--brush-color,#fff);border-radius:50%;box-shadow:0 0 0 1px #080b12;font-size:0}
  #paint-camera{position:absolute;right:20px;bottom:116px;z-index:3;display:flex;align-items:center;gap:8px;pointer-events:none}
  #paint-camera button{pointer-events:auto}
  #camera-stick{position:relative;width:88px;height:88px;padding:0;border-radius:50%;touch-action:none;
    user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden;
    background:rgba(16,22,34,.95);border-color:rgba(125,226,195,.38);box-shadow:var(--shadow)}
  #camera-stick:hover,#camera-stick.is-held{transform:none;border-color:var(--accent-2)}
  #camera-stick.is-held{cursor:grabbing}
  .stick-mark{position:absolute;color:var(--txt-dim);font:12px/1 sans-serif;pointer-events:none}
  .stick-up,.stick-down{left:50%;transform:translateX(-50%)}
  .stick-up{top:4px}.stick-down{bottom:4px}
  .stick-left,.stick-right{top:50%;transform:translateY(-50%)}
  .stick-left{left:5px}.stick-right{right:5px}
  #stick-thumb{position:absolute;top:50%;left:50%;width:36%;aspect-ratio:1;border-radius:50%;
    transform:translate(calc(-50% + var(--stick-x, 0px)),calc(-50% + var(--stick-y, 0px)));
    border:1px solid var(--accent-2);background:#21403d;box-shadow:0 3px 10px rgba(0,0,0,.5);
    pointer-events:none;transition:transform .12s ease-out}
  #camera-stick.is-held #stick-thumb{background:#37675e;transition:none}
  .paint-zoom{display:grid;gap:4px}
  .paint-zoom button{width:44px;height:44px;padding:0;font-size:20px;line-height:1;touch-action:manipulation;
    background:rgba(16,22,34,.95);border-color:rgba(125,226,195,.38)}
  [hidden]{display:none!important}

  /* ---------- 加载 ---------- */
  #loader{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(700px 500px at 50% 45%,#101828 0%,#070a10 70%);
    transition:opacity .6s ease, visibility .6s;
  }
  #loader.hidden{opacity:0;visibility:hidden}
  .ring{
    width:74px;height:74px;border-radius:50%;
    border:2px solid rgba(120,170,255,.14);
    border-top-color:var(--accent);
    border-right-color:rgba(125,226,195,.75);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .lbl{font-size:13px;letter-spacing:.22em;color:var(--txt-dim);text-transform:uppercase}
  #loader .sub{font-size:12px;color:#5d6d88;letter-spacing:.06em}
  .bar{width:min(320px,60vw);height:3px;border-radius:3px;background:rgba(120,170,255,.12);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s ease}
  #pct{font-variant-numeric:tabular-nums;font-size:12px;color:var(--txt-dim);letter-spacing:.1em}

  /* ---------- 面板通用 ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-brd);
    border-radius:14px;
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:var(--shadow);
  }
  .hud{position:fixed;z-index:10}

  /* ---------- 左上：档案标题 ---------- */
  #title{top:20px;left:20px;padding:16px 20px 14px;min-width:230px}
  #title .kicker{
    font-size:10px;letter-spacing:.3em;color:var(--accent);
    text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px
  }
  #title .kicker::before{content:"";width:16px;height:1px;background:var(--accent);display:block}
  #title h1{margin:0;font-size:21px;font-weight:600;letter-spacing:.02em;line-height:1.2}
  #title h1 span{color:var(--accent-2);font-weight:400}
  #title .meta{margin-top:10px;font-size:11.5px;color:var(--txt-dim);letter-spacing:.04em;line-height:1.9}
  #title .meta b{color:#cfdcf2;font-weight:500;font-variant-numeric:tabular-nums}
  #title .hint{margin-top:10px;padding-top:10px;border-top:1px solid rgba(120,160,230,.12);
    font-size:11px;color:#6b7c9b;letter-spacing:.03em;line-height:1.7}

  /* ---------- 右上：视角 ---------- */
  #views{top:20px;right:20px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #views .cap{
    grid-column:1/-1;font-size:10px;letter-spacing:.24em;color:var(--txt-dim);
    text-transform:uppercase;padding:2px 4px 6px
  }
  button{
    font-family:inherit;font-size:12.5px;color:var(--txt);cursor:pointer;
    background:rgba(255,255,255,.045);border:1px solid rgba(130,170,235,.14);
    border-radius:9px;padding:8px 10px;transition:.18s ease;white-space:nowrap;
  }
  button:enabled:hover{background:rgba(78,168,255,.16);border-color:rgba(78,168,255,.5);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button[aria-pressed="true"]{background:rgba(78,168,255,.22);border-color:rgba(78,168,255,.7);color:#fff;
    box-shadow:0 0 0 1px rgba(78,168,255,.25),0 6px 18px rgba(30,120,220,.28)}
  button:disabled{cursor:default;opacity:.42}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- 底部工具条与绘画选项 ---------- */
  #dock{left:50%;transform:translateX(-50%);max-width:calc(100% - 20px);
    bottom:26px;padding:8px;display:flex;gap:8px;align-items:center}
  #dock .dock-group{display:flex;gap:6px;align-items:center}
  #dock .sep{width:1px;height:22px;background:rgba(130,170,235,.16)}
  #dock button{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px}
  #dock .mode-button{border-color:rgba(125,226,195,.38);color:var(--accent-2)}
  #dock .mode-button[aria-pressed="true"]{background:rgba(125,226,195,.16);border-color:var(--accent-2);box-shadow:none}
  #dock #btn-explode{min-width:97px}
  #dock svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  #tool-panel{top:20px;bottom:90px;left:20px;width:270px;display:flex;flex-direction:column;
    background:rgba(16,22,34,.96)}
  body[data-tools] #title .meta,body[data-tools] #title .hint{display:none}
  body[data-tools] #title{left:310px}
  .tool-heading{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 14px 9px;border-bottom:1px solid var(--panel-brd)}
  .tool-heading h2{margin:0;font-size:14px;font-weight:600}
  .tool-heading button{width:32px;height:32px;padding:0;font-size:20px;line-height:1}
  .tool-content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px;
    scrollbar-width:thin;scrollbar-color:#3b4c66 transparent;display:grid;align-content:start;gap:10px}
  .button-row{display:flex;gap:6px}
  .button-row button{flex:1;min-width:0;padding-inline:6px}
  .tool-content label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt-dim);white-space:nowrap}
  .tool-content input[type="color"]{width:35px;height:30px;padding:2px;border:1px solid var(--panel-brd);
    border-radius:6px;background:var(--bg-1);cursor:pointer}
  .tool-content input[type="range"]{width:100%;min-width:30px;margin:0;accent-color:var(--accent-2);cursor:pointer}
  .tool-content input[type="checkbox"]{margin:0;accent-color:var(--accent-2)}
  .tool-content output{min-width:3ch;color:var(--txt);text-align:right;font-variant-numeric:tabular-nums}
  .tool-row{display:grid;grid-template-columns:auto 1fr 42px;align-items:center;gap:8px}
  .tool-note{margin:0;color:var(--txt-dim);font-size:12px;line-height:1.55}
  #paint-status{color:var(--accent-2);overflow-wrap:anywhere}
  #paint-status[data-error]{color:#ffae99}
  #paint-swatches{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #paint-swatches button{flex:0 0 25px;width:25px;height:25px;padding:0;border-radius:50%;
    background:var(--swatch);border:2px solid transparent}
  #paint-swatches button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  #assembly-state{color:var(--accent-2);font-size:12px}
  #part-groups{display:grid;gap:5px}
  .part-button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;text-align:left;padding:8px 9px}
  .part-button small{display:block;margin-top:3px;color:var(--txt-dim);white-space:normal;font-size:10.5px}
  .part-button .part-action{color:var(--accent-2);font-size:11px}

  /* ---------- 右下：坐标轴 ---------- */
  #gizmo-hint{
    right:16px;bottom:14px;font-size:10px;letter-spacing:.18em;color:#4d5c78;
    text-transform:uppercase;z-index:8;pointer-events:none
  }

  /* ---------- 错误 ---------- */
  #err{
    left:50%;top:50%;transform:translate(-50%,-50%);display:none;
    padding:22px 26px;max-width:min(520px,86vw);text-align:center;line-height:1.8
  }
  #err h2{margin:0 0 8px;font-size:16px;color:#ff8a8a}
  #err code{font-size:11.5px;color:var(--txt-dim);word-break:break-all}

  @media (max-width:960px){
    #dock .dock-group:not(.mode-group) button span{display:none}
    #dock button{padding:8px;min-width:38px;min-height:38px}
  }
  @media (max-width:760px){
    #title{top:12px;left:12px;max-width:calc(100vw - 154px);min-width:0;padding:12px 13px}
    #title h1{font-size:16px}
    #title .hint{display:none}
    #views{top:12px;right:12px;grid-template-columns:repeat(2,1fr);padding:8px}
    #dock{bottom:12px;display:grid;grid-template-columns:auto auto;gap:5px;padding:7px}
    #dock .dock-group{justify-content:center;gap:4px}
    #dock .mode-group{grid-column:1/-1}
    #dock .mode-group button{flex:1}
    #dock .sep{display:none}
    body[data-tools] #stage{left:0;bottom:calc(112px + min(36dvh, 260px))}
    body[data-tools] #title,body[data-tools] #views{display:none}
    #tool-panel{top:auto;bottom:112px;left:10px;width:calc(100% - 20px);height:min(36dvh, 260px)}
    #paint-camera{right:10px;bottom:10px;gap:6px}
    #camera-stick{width:72px;height:72px}
    .tool-content{touch-action:pan-y}
    #part-groups{grid-template-columns:repeat(2,minmax(0,1fr))}
    .part-button .part-action{display:none}
    #gizmo-hint{display:none}
  }
  @media (min-width:430px) and (max-width:760px) and (orientation:landscape){
    #dock{display:flex}
    body[data-tools] #stage{left:250px;bottom:0}
    body[data-tools] #title{display:none}
    #tool-panel{top:12px;bottom:68px;width:228px;height:auto}
    #paint-camera{bottom:68px}
    #part-groups{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    button,#loader,.bar > i,#stick-thumb{transition:none}
  }
</style>
</head>
<body>
<div id="stage" aria-label="赛车三维视图">
  <div id="paint-camera" role="group" aria-label="绘画视角控制" hidden>
    <button id="camera-stick" type="button" aria-label="旋转视角摇杆，按住方向键可旋转" title="拖动摇杆旋转，或按住方向键">
      <span class="stick-mark stick-up" aria-hidden="true">▴</span>
      <span class="stick-mark stick-right" aria-hidden="true">▸</span>
      <span class="stick-mark stick-down" aria-hidden="true">▾</span>
      <span class="stick-mark stick-left" aria-hidden="true">◂</span>
      <span id="stick-thumb" aria-hidden="true"></span>
    </button>
    <div class="paint-zoom">
      <button id="paint-zoom-in" type="button" aria-label="放大视角" title="放大视角">＋</button>
      <button id="paint-zoom-out" type="button" aria-label="缩小视角" title="缩小视角">−</button>
    </div>
  </div>
</div>
<div id="brush-cursor" aria-hidden="true" hidden></div>

<!-- 左上档案卡 -->
<section id="title" class="hud panel">
  <div class="kicker">3D 数字档案</div>
  <h1>Dragondance <span>Viewer</span></h1>
  <div class="meta">
    <div>格式 <b id="m-format">STEP AP214 → GLB</b></div>
    <div>外包尺寸 <b id="m-size">—</b></div>
    <div>构件 <b id="m-parts">—</b> · 三角面 <b id="m-tris">—</b></div>
  </div>
  <div class="hint">左键拖拽旋转 · 滚轮缩放 · 右键平移</div>
</section>

<!-- 右上视角 -->
<section id="views" class="hud panel" aria-labelledby="views-label">
  <div id="views-label" class="cap">正交视角</div>
  <button data-view="front" aria-pressed="false" disabled>前视</button>
  <button data-view="back" aria-pressed="false" disabled>后视</button>
  <button data-view="left" aria-pressed="false" disabled>左视</button>
  <button data-view="right" aria-pressed="false" disabled>右视</button>
  <button data-view="top" aria-pressed="false" disabled>俯视</button>
  <button data-view="bottom" aria-pressed="false" disabled>仰视</button>
  <button data-view="iso" aria-pressed="true" style="grid-column:1/-1" disabled>等轴测视角</button>
</section>

<aside id="tool-panel" class="hud panel" aria-labelledby="tools-title" hidden>
  <header class="tool-heading">
    <h2 id="tools-title">表面绘画</h2>
    <button id="btn-close-tools" type="button" aria-label="关闭工具面板" title="关闭 (Esc)">×</button>
  </header>
  <section id="drawing-tools" class="tool-content" aria-label="绘画工具" hidden>
    <div class="button-row" role="group" aria-label="操作模式">
      <button type="button" data-paint-mode="auto" aria-pressed="true">自动</button>
      <button type="button" data-paint-mode="orbit" aria-pressed="false">旋转查看</button>
      <button type="button" data-paint-mode="paint" aria-pressed="false">画笔模式</button>
    </div>
    <p id="paint-hint" class="tool-note">触控笔绘画 · 手指旋转和缩放</p>
    <div id="paint-swatches" role="group" aria-label="快速选色"></div>
    <label>自定义颜色 <input type="color" id="brush-color" value="#f7c948" /></label>
    <div class="tool-row">
      <label for="brush-width">大小</label>
      <input type="range" id="brush-width" min="1" max="100" value="22" />
      <output id="brush-size" for="brush-width">22</output>
    </div>
    <div class="tool-row">
      <label for="brush-opacity">不透明度</label>
      <input type="range" id="brush-opacity" min="5" max="100" value="100" />
      <output id="opacity-value" for="brush-opacity">100%</output>
    </div>
    <label><input type="checkbox" id="pen-pressure" checked /> 压感（笔触大小和透明度）</label>
    <div class="button-row" role="group" aria-label="画笔工具">
      <button id="tool-brush" type="button" aria-pressed="true">画笔</button>
      <button id="tool-eraser" type="button" aria-pressed="false">橡皮</button>
      <button id="tool-soft" type="button" aria-pressed="true" aria-label="柔边画笔">柔边</button>
    </div>
    <div class="button-row">
      <button id="btn-undo" type="button" title="撤销上一笔 (Ctrl+Z)" disabled>撤销</button>
      <button id="btn-redo" type="button" title="重做 (Ctrl+Shift+Z)" disabled>重做</button>
      <button id="btn-clear" type="button" disabled>清空</button>
    </div>
    <div class="button-row">
      <button id="btn-export-paint" type="button" disabled>导出涂鸦</button>
      <button id="btn-import-paint" type="button" disabled>导入涂鸦</button>
    </div>
    <p id="paint-status" class="tool-note" role="status">涂鸦保存在本机</p>
  </section>
  <section id="parts-tools" class="tool-content" aria-label="部件拆解工具" hidden>
    <div id="assembly-state" role="status">已装配</div>
    <div id="part-groups" role="group" aria-label="部件分组"></div>
    <div class="button-row">
      <button id="btn-separate-all" type="button">全部拆开</button>
      <button id="btn-assemble-all" type="button">全部复位</button>
    </div>
    <div class="tool-row">
      <label for="explode-distance">拆解距离</label>
      <input id="explode-distance" type="range" min="0" max="150" value="100" />
      <output id="distance-value" for="explode-distance">100%</output>
    </div>
    <p class="tool-note">点击模型上的部件可切换对应分组。</p>
  </section>
</aside>
<input id="paint-file" type="file" accept="application/json,.json" hidden />

<nav id="dock" class="hud panel" aria-label="查看器工具">
  <div class="dock-group mode-group">
    <button id="btn-explode" class="mode-button" title="部件拆解 (X)" aria-controls="tool-panel" aria-pressed="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 9 3 3-3 3-3-3 3-3ZM4 8V4h4m8 0h4v4m0 8v4h-4m-8 0H4v-4m0 4 4-4m8-8 4-4m-4 12 4 4M4 4l4 4"/></svg>
      <span>爆炸图</span>
    </button>
    <button id="btn-draw" class="mode-button" title="绘画 (D)" aria-controls="tool-panel" aria-pressed="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13.5 6.5 4 4m-12 8 1-4L17 4a2.83 2.83 0 0 1 4 4L10.5 18.5l-5 1Z"/><path d="M3 21h18"/></svg>
      <span>绘画</span>
    </button>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="dock-group">
    <button id="btn-rotate" title="自动旋转 (R)" aria-label="自动旋转" aria-pressed="true" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
      <span>自动旋转</span>
    </button>
    <button id="btn-wire" title="线框 (W)" aria-label="线框" aria-pressed="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 8v8l-10 6L2 16V8z"/><path d="M2 8l10 6 10-6M12 14v8"/></svg>
      <span>线框</span>
    </button>
    <button id="btn-grid" title="网格 (G)" aria-label="网格" aria-pressed="true" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      <span>网格</span>
    </button>
    <button id="btn-edges" title="轮廓线 (E)" aria-label="轮廓线" aria-pressed="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 12h16M12 6v12"/></svg>
      <span>轮廓</span>
    </button>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="dock-group">
    <button id="btn-reset" title="复位视角 (0)" aria-label="复位视角" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>
      <span>复位</span>
    </button>
    <button id="btn-shot" title="截图保存 (S)" aria-label="截图保存" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
      <span>截图</span>
    </button>
    <button id="btn-full" title="全屏 (F)" aria-label="全屏" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6M15 3h6v6M21 15v6h-6M3 15v6h6"/></svg>
      <span>全屏</span>
    </button>
  </div>
</nav>
